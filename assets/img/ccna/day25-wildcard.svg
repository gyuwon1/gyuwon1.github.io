<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d">
  <title id="t">서브넷 마스크와 와일드카드 마스크</title>
  <desc id="d">와일드카드 마스크는 255.255.255.255에서 서브넷 마스크를 뺀 값이다. 비트 0은 반드시 일치해야 하고 비트 1은 무시한다. /30은 0.0.0.3, /24는 0.0.0.255, 호스트 하나는 0.0.0.0이다</desc>
  <style>
    text { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 13px; fill: #1f2933; }
    .small { font-size: 11px; fill: #52606d; }
    .head { font-size: 14px; font-weight: 700; }
    .mono { font-family: Consolas, "Courier New", monospace; font-size: 12px; }
    .box { fill: #e3f2fd; stroke: #7aa5d2; stroke-width: 1.5; }
    .ok { fill: #e8f5e9; stroke: #2e7d4f; stroke-width: 1.5; }
    .net { fill: #fff8e1; stroke: #d9a441; stroke-width: 1.5; }
    .bad { fill: #fdecea; stroke: #c0392b; stroke-width: 1.5; }
    .code { fill: #f5f7fa; stroke: #cbd2d9; stroke-width: 1.2; }
    .arrow { stroke: #52606d; stroke-width: 2; fill: none; }
    .link { stroke: #7b8794; stroke-width: 2; fill: none; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52606d"/></marker></defs>
  <rect width="800" height="400" rx="12" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="30" y="32" class="head">와일드카드 마스크 = 255.255.255.255 - 서브넷 마스크</text>
  <rect class="box" x="30" y="50" width="220" height="30" rx="6"/>
  <text x="140" y="70" text-anchor="middle" class="head">서브넷 마스크</text>
  <rect class="ok" x="290" y="50" width="180" height="30" rx="6"/>
  <text x="380" y="70" text-anchor="middle" class="head">와일드카드</text>
  <rect class="net" x="510" y="50" width="260" height="30" rx="6"/>
  <text x="640" y="70" text-anchor="middle" class="head">network 문이 잡는 범위</text>
  <text x="270" y="106" text-anchor="middle" class="head">→</text>
  <text x="490" y="106" text-anchor="middle" class="head">→</text>
  <text x="140" y="106" text-anchor="middle" class="mono">255.255.255.252 (/30)</text>
  <text x="380" y="106" text-anchor="middle" class="mono">0.0.0.3</text>
  <text x="640" y="106" text-anchor="middle" class="mono">10.0.12.0 ~ 10.0.12.3</text>
  <text x="140" y="140" text-anchor="middle" class="mono">255.255.255.0 (/24)</text>
  <text x="380" y="140" text-anchor="middle" class="mono">0.0.0.255</text>
  <text x="640" y="140" text-anchor="middle" class="mono">192.168.1.0 ~ 192.168.1.255</text>
  <text x="270" y="140" text-anchor="middle" class="head">→</text>
  <text x="490" y="140" text-anchor="middle" class="head">→</text>
  <text x="140" y="174" text-anchor="middle" class="mono">255.255.255.255 (/32)</text>
  <text x="380" y="174" text-anchor="middle" class="mono">0.0.0.0</text>
  <text x="640" y="174" text-anchor="middle" class="mono">1.1.1.1 하나뿐</text>
  <text x="270" y="174" text-anchor="middle" class="head">→</text>
  <text x="490" y="174" text-anchor="middle" class="head">→</text>
  <text x="30" y="214" class="head">마지막 옥텟으로 보는 /30</text>
  <text x="30" y="246" class="small">서브넷 마스크</text>
  <text x="30" y="296" class="small">와일드카드</text>
  <rect class="box" x="170" y="226" width="40" height="30" rx="4"/><text x="190" y="246" text-anchor="middle" class="mono">1</text>
  <rect class="ok" x="170" y="276" width="40" height="30" rx="4"/><text x="190" y="296" text-anchor="middle" class="mono">0</text>
  <rect class="box" x="214" y="226" width="40" height="30" rx="4"/><text x="234" y="246" text-anchor="middle" class="mono">1</text>
  <rect class="ok" x="214" y="276" width="40" height="30" rx="4"/><text x="234" y="296" text-anchor="middle" class="mono">0</text>
  <rect class="box" x="258" y="226" width="40" height="30" rx="4"/><text x="278" y="246" text-anchor="middle" class="mono">1</text>
  <rect class="ok" x="258" y="276" width="40" height="30" rx="4"/><text x="278" y="296" text-anchor="middle" class="mono">0</text>
  <rect class="box" x="302" y="226" width="40" height="30" rx="4"/><text x="322" y="246" text-anchor="middle" class="mono">1</text>
  <rect class="ok" x="302" y="276" width="40" height="30" rx="4"/><text x="322" y="296" text-anchor="middle" class="mono">0</text>
  <rect class="box" x="346" y="226" width="40" height="30" rx="4"/><text x="366" y="246" text-anchor="middle" class="mono">1</text>
  <rect class="ok" x="346" y="276" width="40" height="30" rx="4"/><text x="366" y="296" text-anchor="middle" class="mono">0</text>
  <rect class="box" x="390" y="226" width="40" height="30" rx="4"/><text x="410" y="246" text-anchor="middle" class="mono">1</text>
  <rect class="ok" x="390" y="276" width="40" height="30" rx="4"/><text x="410" y="296" text-anchor="middle" class="mono">0</text>
  <rect class="net" x="434" y="226" width="40" height="30" rx="4"/><text x="454" y="246" text-anchor="middle" class="mono">0</text>
  <rect class="bad" x="434" y="276" width="40" height="30" rx="4"/><text x="454" y="296" text-anchor="middle" class="mono">1</text>
  <rect class="net" x="478" y="226" width="40" height="30" rx="4"/><text x="498" y="246" text-anchor="middle" class="mono">0</text>
  <rect class="bad" x="478" y="276" width="40" height="30" rx="4"/><text x="498" y="296" text-anchor="middle" class="mono">1</text>
  <text x="170" y="326" class="small">마스크 1(네트워크) → 와일드카드 0: 반드시 일치</text>
  <text x="170" y="344" class="small">마스크 0(호스트) → 와일드카드 1: 무시</text>
  <text x="540" y="246" class="small">네트워크 비트 6개</text>
  <text x="540" y="296" class="small">호스트 비트 2개 (무시)</text>
  <text x="30" y="378" class="small">0.0.0.3이면 마지막 옥텟의 끝 2비트는 무엇이어도 되므로 .0~.3 네 주소가 범위에 들어온다</text>
</svg>
