<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d">
  <title id="t">DHCP Snooping의 trusted 포트와 untrusted 포트</title>
  <desc id="d">PC1이 DHCP Discover를 보내면 정상 DHCP 서버의 Offer는 trusted 포트 Gi0/1로 들어와 통과하고, 공격자가 만든 가짜 DHCP 서버의 Offer는 untrusted 포트 Fa0/2로 들어와 스위치가 버린다.</desc>
  <style>
    text { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 13px; fill: #1f2933; }
    .small { font-size: 11px; fill: #52606d; }
    .head { font-size: 14px; font-weight: 700; }
    .host { fill: #e8f5e9; stroke: #4c9a5a; stroke-width: 1.5; }
    .bad { fill: #fdecea; stroke: #c0392b; stroke-width: 1.5; }
    .sw { fill: #e3f2fd; stroke: #7aa5d2; stroke-width: 1.5; }
    .srv { fill: #f5f7fa; stroke: #7b8794; stroke-width: 1.5; }
    .ln { stroke: #52606d; stroke-width: 1.8; fill: none; }
    .r { stroke: #c0392b; stroke-width: 2.4; fill: none; }
    .g { stroke: #4c9a5a; stroke-width: 2.4; fill: none; }
  </style>
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="20" y="28" class="head">DHCP 응답은 trusted 포트로 들어온 것만 통과한다</text>

  <rect x="30" y="50" width="140" height="50" class="host"/>
  <text x="100" y="72" text-anchor="middle">PC1</text>
  <text x="100" y="90" text-anchor="middle" class="small">IP 주소를 요청</text>

  <rect x="300" y="125" width="160" height="70" class="sw"/>
  <text x="380" y="154" text-anchor="middle">SW1</text>
  <text x="380" y="174" text-anchor="middle" class="small">DHCP Snooping 활성</text>

  <rect x="560" y="50" width="170" height="50" class="srv"/>
  <text x="645" y="72" text-anchor="middle">정상 DHCP 서버</text>
  <text x="645" y="90" text-anchor="middle" class="small">Gi0/1 쪽에 연결</text>

  <rect x="30" y="250" width="190" height="60" class="bad"/>
  <text x="125" y="274" text-anchor="middle">공격자 PC</text>
  <text x="125" y="294" text-anchor="middle" class="small">가짜 DHCP 서버를 실행</text>

  <path d="M170 75 L300 140" class="ln"/>
  <path d="M460 140 L560 80" class="ln"/>
  <path d="M220 270 L300 180" class="ln"/>

  <text x="40" y="128" class="small">Fa0/1 (untrusted)</text>
  <text x="470" y="178" class="small">Gi0/1 (trusted)</text>
  <text x="40" y="236" class="small">Fa0/2 (untrusted)</text>

  <path d="M240 235 L270 205" class="r"/>
  <path d="M270 235 L240 205" class="r"/>
  <path d="M500 118 L520 108" class="g"/>

  <text x="330" y="236" class="head">동작</text>
  <text x="330" y="258">1. PC1이 DHCPDISCOVER를 브로드캐스트한다</text>
  <text x="330" y="280">2. 정상 서버의 OFFER는 trusted 포트로 들어와 통과한다</text>
  <text x="330" y="302">3. 공격자의 OFFER는 untrusted 포트로 들어와 버려진다</text>
  <text x="330" y="324">4. PC1은 정상 서버의 설정만 받는다</text>
</svg>
