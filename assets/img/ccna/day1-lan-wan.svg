<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t d">
  <title id="t">LAN과 WAN</title>
  <desc id="d">본사 LAN과 지사 LAN이 통신사 WAN 회선으로 연결된 모습</desc>
  <style>
    text { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 14px; fill: #1f2933; }
    .small { font-size: 12px; fill: #52606d; }
    .title { font-size: 15px; font-weight: 700; }
    .line { stroke: #52606d; stroke-width: 2; fill: none; }
  </style>
  <rect width="800" height="300" rx="12" fill="#ffffff" stroke="#d9e2ec"/>

  <!-- 본사 LAN -->
  <rect x="20" y="40" width="260" height="220" rx="10" fill="#f0f7ff" stroke="#7aa5d2" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="150" y="30" text-anchor="middle" class="title">본사 LAN</text>
  <rect x="40" y="75" width="55" height="36" rx="6" fill="#f1f5f9" stroke="#829ab1" stroke-width="2"/>
  <text x="67" y="98" text-anchor="middle">PC</text>
  <rect x="40" y="190" width="55" height="36" rx="6" fill="#f1f5f9" stroke="#829ab1" stroke-width="2"/>
  <text x="67" y="213" text-anchor="middle">PC</text>
  <rect x="120" y="130" width="60" height="40" rx="6" fill="#dcf3e1" stroke="#5aa86e" stroke-width="2"/>
  <text x="150" y="155" text-anchor="middle">스위치</text>
  <rect x="205" y="130" width="60" height="40" rx="20" fill="#dbe9fb" stroke="#4f8fd9" stroke-width="2"/>
  <text x="235" y="155" text-anchor="middle">라우터</text>
  <line class="line" x1="95" y1="93" x2="120" y2="142"/>
  <line class="line" x1="95" y1="208" x2="120" y2="158"/>
  <line class="line" x1="180" y1="150" x2="205" y2="150"/>

  <!-- WAN -->
  <ellipse cx="400" cy="150" rx="90" ry="52" fill="#fff6e0" stroke="#e0b04f" stroke-width="2"/>
  <text x="400" y="145" text-anchor="middle" class="title">WAN</text>
  <text x="400" y="165" text-anchor="middle" class="small">통신사 회선</text>
  <line class="line" x1="265" y1="150" x2="310" y2="150"/>
  <line class="line" x1="490" y1="150" x2="535" y2="150"/>

  <!-- 지사 LAN -->
  <rect x="520" y="40" width="260" height="220" rx="10" fill="#f0f7ff" stroke="#7aa5d2" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="650" y="30" text-anchor="middle" class="title">지사 LAN</text>
  <rect x="535" y="130" width="60" height="40" rx="20" fill="#dbe9fb" stroke="#4f8fd9" stroke-width="2"/>
  <text x="565" y="155" text-anchor="middle">라우터</text>
  <rect x="620" y="130" width="60" height="40" rx="6" fill="#dcf3e1" stroke="#5aa86e" stroke-width="2"/>
  <text x="650" y="155" text-anchor="middle">스위치</text>
  <rect x="705" y="75" width="55" height="36" rx="6" fill="#f1f5f9" stroke="#829ab1" stroke-width="2"/>
  <text x="732" y="98" text-anchor="middle">PC</text>
  <rect x="705" y="190" width="55" height="36" rx="6" fill="#f1f5f9" stroke="#829ab1" stroke-width="2"/>
  <text x="732" y="213" text-anchor="middle">서버</text>
  <line class="line" x1="595" y1="150" x2="620" y2="150"/>
  <line class="line" x1="680" y1="142" x2="705" y2="93"/>
  <line class="line" x1="680" y1="158" x2="705" y2="208"/>
</svg>
