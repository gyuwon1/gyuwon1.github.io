<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d">
  <title>이중화 링크에서 브로드캐스트가 순환하는 모습</title>
  <desc>SW1, SW2, SW3이 삼각형으로 연결되어 있고 PC-A가 보낸 브로드캐스트 프레임이 SW2, SW1, SW3, SW2 순서로 고리를 계속 돈다. 오른쪽에는 이로 인한 세 가지 문제가 적혀 있다</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 13px; fill: #1f2933; }
    .small { font-size: 11px; fill: #52606d; }
    .head { font-size: 15px; font-weight: 700; }
    .link { stroke: #9aa5b1; stroke-width: 3; fill: none; }
    .flow { stroke: #d98a1f; stroke-width: 2.5; fill: none; marker-end: url(#ar); }
    .sw { fill: #e3f2fd; stroke: #7aa5d2; stroke-width: 2; }
  </style>
  <rect width="800" height="330" rx="12" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="270" y="26" text-anchor="middle" class="head">STP가 없는 이중화 구성</text>
  <line class="link" x1="280" y1="70" x2="120" y2="230"/>
  <line class="link" x1="280" y1="70" x2="440" y2="230"/>
  <line class="link" x1="120" y1="230" x2="440" y2="230"/>
  <rect class="sw" x="230" y="48" width="100" height="44" rx="6"/>
  <text x="280" y="75" text-anchor="middle">SW1</text>
  <rect class="sw" x="70" y="208" width="100" height="44" rx="6"/>
  <text x="120" y="235" text-anchor="middle">SW2</text>
  <rect class="sw" x="390" y="208" width="100" height="44" rx="6"/>
  <text x="440" y="235" text-anchor="middle">SW3</text>
  <rect x="80" y="284" width="80" height="30" rx="4" fill="#f0f4f8" stroke="#9aa5b1" stroke-width="2"/>
  <text x="120" y="304" text-anchor="middle">PC-A</text>
  <line class="link" x1="120" y1="252" x2="120" y2="284" stroke-width="2"/>
  <line class="flow" x1="130" y1="200" x2="236" y2="94"/>
  <line class="flow" x1="326" y1="96" x2="434" y2="204"/>
  <line class="flow" x1="385" y1="244" x2="175" y2="244"/>
  <text x="168" y="150" text-anchor="end" class="small">1 브로드캐스트</text>
  <text x="392" y="140" class="small">2</text>
  <text x="280" y="268" text-anchor="middle" class="small">3 다시 SW2로 돌아와 반복</text>
  <line x1="540" y1="44" x2="540" y2="300" stroke="#d9e2ec" stroke-width="2"/>
  <text x="560" y="70" class="head">고리에서 생기는 문제</text>
  <text x="560" y="106">브로드캐스트 폭풍</text>
  <text x="560" y="126" class="small">프레임이 복제되며 계속 돌고</text>
  <text x="560" y="142" class="small">TTL이 없어 사라지지 않는다</text>
  <text x="560" y="182">MAC 테이블 불안정</text>
  <text x="560" y="202" class="small">같은 출발지 MAC이 서로 다른</text>
  <text x="560" y="218" class="small">포트에서 번갈아 학습된다</text>
  <text x="560" y="258">장비 자원 소진</text>
  <text x="560" y="278" class="small">대역과 CPU가 다 쓰이고</text>
  <text x="560" y="294" class="small">정상 통신이 멈춘다</text>
</svg>
