<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d">
  <title id="t">Syslog 심각도와 SNMP 전달 경로</title>
  <desc id="d">왼쪽은 Syslog 심각도 0부터 7까지의 표이고, 오른쪽은 장비가 Syslog 서버와 SNMP 관리 서버에 보내는 경로이다</desc>
  <style>
    text { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 13px; fill: #1f2933; }
    .small { font-size: 11px; fill: #52606d; }
    .head { font-size: 14px; font-weight: 700; }
    .box { fill: #e3f2fd; stroke: #7aa5d2; stroke-width: 1.5; }
    .ok { fill: #e8f5e9; stroke: #2e7d4f; stroke-width: 1.5; }
    .net { fill: #fff8e1; stroke: #d9a441; stroke-width: 1.5; }
    .a1 { stroke: #2e7d4f; stroke-width: 2.2; fill: none; }
    .a2 { stroke: #c0762b; stroke-width: 2.2; fill: none; }
  </style>
  <rect width="800" height="400" rx="12" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="30" y="32" class="head">Syslog 심각도</text>
  <rect class="net" x="30" y="46" width="340" height="28" rx="4"/><text x="42" y="65" class="head">0 Emergency</text><text x="170" y="65" class="small">시스템을 쓸 수 없다</text>
  <rect class="net" x="30" y="76" width="340" height="28" rx="4"/><text x="42" y="95" class="head">1 Alert</text><text x="170" y="95" class="small">즉시 조치해야 한다</text>
  <rect class="net" x="30" y="106" width="340" height="28" rx="4"/><text x="42" y="125" class="head">2 Critical</text><text x="170" y="125" class="small">심각한 상태</text>
  <rect class="net" x="30" y="136" width="340" height="28" rx="4"/><text x="42" y="155" class="head">3 Error</text><text x="170" y="155" class="small">오류</text>
  <rect class="box" x="30" y="166" width="340" height="28" rx="4"/><text x="42" y="185" class="head">4 Warning</text><text x="170" y="185" class="small">경고</text>
  <rect class="box" x="30" y="196" width="340" height="28" rx="4"/><text x="42" y="215" class="head">5 Notice</text><text x="170" y="215" class="small">정상이지만 눈여겨볼 일</text>
  <rect class="ok" x="30" y="226" width="340" height="28" rx="4"/><text x="42" y="245" class="head">6 Informational</text><text x="170" y="245" class="small">일반 정보</text>
  <rect class="ok" x="30" y="256" width="340" height="28" rx="4"/><text x="42" y="275" class="head">7 Debugging</text><text x="170" y="275" class="small">디버그 메시지</text>
  <text x="30" y="306" class="small">logging trap warnings 로 정하면 0부터 4까지만 서버로 보낸다.</text>
  <text x="30" y="324" class="small">숫자가 작을수록 심각하다.</text>
  <rect class="box" x="420" y="60" width="150" height="56" rx="8"/><text x="495" y="84" text-anchor="middle" class="head">라우터, 스위치</text><text x="495" y="102" text-anchor="middle" class="small">SNMP 에이전트</text>
  <rect class="ok" x="620" y="30" width="150" height="56" rx="8"/><text x="695" y="54" text-anchor="middle" class="head">Syslog 서버</text><text x="695" y="72" text-anchor="middle" class="small">UDP 514</text>
  <rect class="ok" x="620" y="150" width="150" height="56" rx="8"/><text x="695" y="174" text-anchor="middle" class="head">SNMP 관리 서버</text><text x="695" y="192" text-anchor="middle" class="small">NMS</text>
  <line class="a1" x1="570" y1="80" x2="614" y2="62"/><polygon points="620,60 606,58 611,69" fill="#2e7d4f"/>
  <text x="520" y="40" class="small">로그 메시지</text>
  <line class="a2" x1="570" y1="100" x2="614" y2="158"/><polygon points="618,162 604,155 612,147" fill="#c0762b"/>
  <text x="606" y="130" class="small">trap, 162</text>
  <text x="620" y="228" class="small">관리 서버가 장비에 get, set 요청: 161</text>
  <text x="420" y="270" class="small">장비는 이벤트를 Syslog로 흘려보내고,</text>
  <text x="420" y="290" class="small">관리 서버는 SNMP로 상태를 물어보거나 trap을 받는다.</text>
</svg>
