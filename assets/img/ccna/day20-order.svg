<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t d">
  <title>통신이 안 될 때 아래층부터 확인하는 순서</title>
  <desc>1단계 포트가 up인지 확인, 2단계 포트가 올바른 VLAN에 속하는지 확인, 3단계 트렁크에서 해당 VLAN이 허용되고 네이티브 VLAN이 같은지 확인, 4단계 STP에서 해당 포트가 차단 상태가 아닌지 확인, 5단계 VLAN 간 통신이면 라우터 서브인터페이스 설정을 확인한다</desc>
  <style>
    text { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 13px; fill: #1f2933; }
    .small { font-size: 11px; fill: #52606d; }
    .head { font-size: 15px; font-weight: 700; }
    .link { stroke: #7aa5d2; stroke-width: 3; fill: none; }
    .trunk { stroke: #2e7d4f; stroke-width: 3; fill: none; }
    .sw { fill: #e3f2fd; stroke: #7aa5d2; stroke-width: 2; }
    .rt { fill: #fff4e0; stroke: #d98c1f; stroke-width: 2; }
    .pc { fill: #f5f7fa; stroke: #9aa5b1; stroke-width: 2; }
    .th { fill: #e3f2fd; stroke: #7aa5d2; stroke-width: 1.5; }
    .td { fill: #ffffff; stroke: #d9e2ec; stroke-width: 1.5; }
    .arr { stroke: #2e7d4f; stroke-width: 2; fill: none; marker-end: url(#a); }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d4f"/></marker></defs>
  <rect width="800" height="300" rx="12" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="400" y="28" text-anchor="middle" class="head">점검 순서</text>
  <rect class="sw" x="20" y="70" width="130" height="110" rx="6"/>
  <text x="85" y="96" text-anchor="middle" class="head">1</text>
  <text x="85" y="120" text-anchor="middle">포트 상태</text>
  <text x="85" y="142" text-anchor="middle" class="small">up/up인가</text>
  <text x="85" y="160" text-anchor="middle" class="small">케이블, shutdown</text>
  <rect class="sw" x="175" y="70" width="130" height="110" rx="6"/>
  <text x="240" y="96" text-anchor="middle" class="head">2</text>
  <text x="240" y="120" text-anchor="middle">VLAN 소속</text>
  <text x="240" y="142" text-anchor="middle" class="small">액세스 VLAN이</text>
  <text x="240" y="160" text-anchor="middle" class="small">맞는가</text>
  <rect class="sw" x="330" y="70" width="130" height="110" rx="6"/>
  <text x="395" y="96" text-anchor="middle" class="head">3</text>
  <text x="395" y="120" text-anchor="middle">트렁크</text>
  <text x="395" y="142" text-anchor="middle" class="small">허용 VLAN,</text>
  <text x="395" y="160" text-anchor="middle" class="small">네이티브 VLAN</text>
  <rect class="sw" x="485" y="70" width="130" height="110" rx="6"/>
  <text x="550" y="96" text-anchor="middle" class="head">4</text>
  <text x="550" y="120" text-anchor="middle">STP 상태</text>
  <text x="550" y="142" text-anchor="middle" class="small">차단 포트가</text>
  <text x="550" y="160" text-anchor="middle" class="small">경로를 막는가</text>
  <rect class="rt" x="640" y="70" width="140" height="110" rx="6"/>
  <text x="710" y="96" text-anchor="middle" class="head">5</text>
  <text x="710" y="120" text-anchor="middle">VLAN 간 라우팅</text>
  <text x="710" y="142" text-anchor="middle" class="small">서브인터페이스,</text>
  <text x="710" y="160" text-anchor="middle" class="small">encapsulation</text>
  <path class="arr" d="M150 125H173"/><path class="arr" d="M305 125H328"/><path class="arr" d="M460 125H483"/><path class="arr" d="M615 125H638"/>
  <text x="400" y="230" text-anchor="middle">물리 연결부터 시작해 위로 올라간다</text>
  <text x="400" y="252" text-anchor="middle" class="small">같은 VLAN 안의 통신이면 5단계는 건너뛴다</text>
</svg>
