<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="t d">
  <title id="t">AAA의 구성</title>
  <desc id="d">관리자가 라우터에 SSH로 로그인하면 라우터는 AAA 서버에 인증을 요청하고 결과와 권한을 받는다. AAA는 인증, 인가, 어카운팅 세 가지로 이루어진다.</desc>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#52606d"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 13px; fill: #1f2933; }
    .small { font-size: 11px; fill: #52606d; }
    .head { font-size: 14px; font-weight: 700; }
    .box { fill: #f5f7fa; stroke: #cfd8dc; stroke-width: 1.5; }
    .key { fill: #fff3e0; stroke: #e0a050; stroke-width: 1.5; }
    .th { fill: #e3f2fd; stroke: #7aa5d2; stroke-width: 1.5; }
    .ln { stroke: #52606d; stroke-width: 1.6; fill: none; marker-end: url(#ar); }
  </style>
  <rect width="760" height="320" fill="#ffffff"/>
  <text x="20" y="28" class="head">로그인할 때 일어나는 일</text>

  <rect x="20" y="70" width="110" height="60" class="box"/>
  <text x="75" y="105" text-anchor="middle">관리자 PC</text>
  <rect x="280" y="70" width="150" height="60" class="key"/>
  <text x="355" y="96" text-anchor="middle">라우터</text>
  <text x="355" y="115" text-anchor="middle" class="small">접속을 받는 장비</text>
  <rect x="590" y="70" width="150" height="60" class="box"/>
  <text x="665" y="96" text-anchor="middle">AAA 서버</text>
  <text x="665" y="115" text-anchor="middle" class="small">RADIUS / TACACS+</text>

  <text x="205" y="94" text-anchor="middle" class="small">SSH 로그인</text>
  <path d="M130 102 L276 102" class="ln"/>
  <text x="510" y="82" text-anchor="middle" class="small">인증 요청</text>
  <path d="M430 88 L586 88" class="ln"/>
  <text x="510" y="126" text-anchor="middle" class="small">결과, 권한</text>
  <path d="M586 112 L434 112" class="ln"/>

  <text x="20" y="176" class="head">AAA 세 가지 역할</text>
  <rect x="20" y="190" width="230" height="110" class="th"/>
  <text x="135" y="214" text-anchor="middle">Authentication 인증</text>
  <text x="135" y="240" text-anchor="middle">누구인가</text>
  <text x="135" y="262" text-anchor="middle" class="small">사용자 이름과 비밀번호 확인</text>
  <rect x="265" y="190" width="230" height="110" class="th"/>
  <text x="380" y="214" text-anchor="middle">Authorization 인가</text>
  <text x="380" y="240" text-anchor="middle">무엇을 할 수 있는가</text>
  <text x="380" y="262" text-anchor="middle" class="small">privilege level, 쓸 수 있는 명령</text>
  <rect x="510" y="190" width="230" height="110" class="th"/>
  <text x="625" y="214" text-anchor="middle">Accounting 어카운팅</text>
  <text x="625" y="240" text-anchor="middle">무엇을 했는가</text>
  <text x="625" y="262" text-anchor="middle" class="small">로그인 시각, 입력한 명령 기록</text>
</svg>
