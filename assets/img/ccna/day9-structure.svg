<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t d">
  <title id="t">IPv6 주소 구조</title>
  <desc id="d">128비트 주소는 앞 64비트 네트워크 프리픽스와 뒤 64비트 인터페이스 ID로 나뉘고, 프리픽스는 사이트 프리픽스 48비트와 서브넷 ID 16비트로 구성된다</desc>
  <style>
    text { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 13px; fill: #1f2933; }
    .small { font-size: 12px; fill: #52606d; }
    .head { font-size: 15px; font-weight: 700; }
    .mono { font-family: Consolas, "Courier New", monospace; font-size: 15px; }
  </style>
  <rect width="800" height="300" rx="12" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="400" y="30" text-anchor="middle" class="head">일반적인 IPv6 유니캐스트 주소 구조 (128비트)</text>
  <line x1="40" y1="72" x2="400" y2="72" stroke="#52606d" stroke-width="2"/>
  <line x1="40" y1="72" x2="40" y2="82" stroke="#52606d" stroke-width="2"/>
  <line x1="400" y1="72" x2="400" y2="82" stroke="#52606d" stroke-width="2"/>
  <text x="220" y="62" text-anchor="middle">네트워크 프리픽스 /64</text>
  <line x1="400" y1="72" x2="760" y2="72" stroke="#52606d" stroke-width="2"/>
  <line x1="760" y1="72" x2="760" y2="82" stroke="#52606d" stroke-width="2"/>
  <text x="580" y="62" text-anchor="middle">인터페이스 ID (장비 식별)</text>
  <rect x="40" y="86" width="270" height="50" fill="#e3f2fd" stroke="#7aa5d2"/>
  <text x="175.0" y="116" text-anchor="middle">사이트 프리픽스 48비트</text>
  <rect x="310" y="86" width="90" height="50" fill="#fff8e1" stroke="#7aa5d2"/>
  <text x="355.0" y="116" text-anchor="middle">서브넷 ID 16</text>
  <rect x="400" y="86" width="360" height="50" fill="#e8f5e9" stroke="#7aa5d2"/>
  <text x="580.0" y="116" text-anchor="middle">인터페이스 ID 64비트</text>
  <text x="40" y="170" class="small">예: 2001:db8:1:1::1/64</text>
  <rect x="40" y="180" width="270" height="40" fill="#f5f7fa" stroke="#9aa5b1"/>
  <text x="175.0" y="205" text-anchor="middle" class="mono">2001:0db8:0001</text>
  <rect x="310" y="180" width="90" height="40" fill="#f5f7fa" stroke="#9aa5b1"/>
  <text x="355.0" y="205" text-anchor="middle" class="mono">0001</text>
  <rect x="400" y="180" width="360" height="40" fill="#f5f7fa" stroke="#9aa5b1"/>
  <text x="580.0" y="205" text-anchor="middle" class="mono">0000:0000:0000:0001</text>
  <text x="400" y="256" text-anchor="middle">서브넷 하나는 보통 /64를 쓰고, 한 사이트(/48)에서 서브넷을 65,536개까지 만들 수 있다</text>
  <text x="400" y="278" text-anchor="middle" class="small">IPv4처럼 호스트 수에 맞춰 프리픽스를 줄이지 않는다</text>
</svg>
