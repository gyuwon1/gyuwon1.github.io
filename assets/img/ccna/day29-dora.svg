<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d">
  <title id="t">DHCP DORA 4단계</title>
  <desc id="d">클라이언트와 서버가 Discover, Offer, Request, Ack 순서로 메시지를 주고받는다. Discover와 Request는 브로드캐스트이다</desc>
  <style>
    text { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 13px; fill: #1f2933; }
    .small { font-size: 11px; fill: #52606d; }
    .head { font-size: 14px; font-weight: 700; }
    .box { fill: #e3f2fd; stroke: #7aa5d2; stroke-width: 1.5; }
    .ok { fill: #e8f5e9; stroke: #2e7d4f; stroke-width: 1.5; }
    .net { fill: #fff8e1; stroke: #d9a441; stroke-width: 1.5; }
    .life { stroke: #9aa5b1; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .a1 { stroke: #2e7d4f; stroke-width: 2.2; fill: none; }
    .a2 { stroke: #c0762b; stroke-width: 2.2; fill: none; }
    .link { stroke: #7b8794; stroke-width: 2; fill: none; }
  </style>
  <rect width="800" height="420" rx="12" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="30" y="32" class="head">주소를 받기까지 메시지 네 개</text>
  <rect class="net" x="60" y="52" width="160" height="40" rx="8"/><text x="140" y="77" text-anchor="middle" class="head">클라이언트</text>
  <rect class="ok" x="580" y="52" width="160" height="40" rx="8"/><text x="660" y="77" text-anchor="middle" class="head">DHCP 서버</text>
  <line class="life" x1="140" y1="92" x2="140" y2="400"/><line class="life" x1="660" y1="92" x2="660" y2="400"/>
  <line class="a1" x1="140" y1="130" x2="654" y2="150"/>
  <polygon points="660,150 645,144 647,156" fill="#2e7d4f"/>
  <text x="400" y="120" text-anchor="middle" class="head">1 Discover</text>
  <text x="400" y="172" text-anchor="middle" class="small">서버를 찾는다. 0.0.0.0:68 에서 255.255.255.255:67 로 브로드캐스트</text>
  <line class="a2" x1="660" y1="210" x2="146" y2="230"/>
  <polygon points="140,230 155,224 153,236" fill="#c0762b"/>
  <text x="400" y="200" text-anchor="middle" class="head">2 Offer</text>
  <text x="400" y="252" text-anchor="middle" class="small">빌려 줄 IP, 마스크, 게이트웨이, 기간을 제안한다</text>
  <line class="a1" x1="140" y1="290" x2="654" y2="310"/>
  <polygon points="660,310 645,304 647,316" fill="#2e7d4f"/>
  <text x="400" y="280" text-anchor="middle" class="head">3 Request</text>
  <text x="400" y="332" text-anchor="middle" class="small">제안을 수락한다. 다른 서버에도 알리려고 브로드캐스트로 보낸다</text>
  <line class="a2" x1="660" y1="360" x2="146" y2="380"/>
  <polygon points="140,380 155,374 153,386" fill="#c0762b"/>
  <text x="400" y="350" text-anchor="middle" class="head">4 Ack</text>
  <text x="400" y="402" text-anchor="middle" class="small">확정한다. 이 시점부터 클라이언트가 주소를 쓴다</text>
</svg>
