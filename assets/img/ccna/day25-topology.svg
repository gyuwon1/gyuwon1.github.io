<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" role="img" aria-labelledby="t d">
  <title id="t">OSPF 설정 예시 토폴로지</title>
  <desc id="d">R1과 R2가 10.0.12.0/30 링크로 연결되고 각자 사용자 LAN을 가진다. 두 라우터 모두 network 명령으로 링크와 LAN을 Area 0에 넣고 LAN 쪽 인터페이스는 passive-interface로 지정한다</desc>
  <style>
    text { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 13px; fill: #1f2933; }
    .small { font-size: 11px; fill: #52606d; }
    .head { font-size: 14px; font-weight: 700; }
    .mono { font-family: Consolas, "Courier New", monospace; font-size: 12px; }
    .box { fill: #e3f2fd; stroke: #7aa5d2; stroke-width: 1.5; }
    .ok { fill: #e8f5e9; stroke: #2e7d4f; stroke-width: 1.5; }
    .net { fill: #fff8e1; stroke: #d9a441; stroke-width: 1.5; }
    .bad { fill: #fdecea; stroke: #c0392b; stroke-width: 1.5; }
    .code { fill: #f5f7fa; stroke: #cbd2d9; stroke-width: 1.2; }
    .arrow { stroke: #52606d; stroke-width: 2; fill: none; }
    .link { stroke: #7b8794; stroke-width: 2; fill: none; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52606d"/></marker></defs>
  <rect width="800" height="350" rx="12" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="30" y="32" class="head">두 라우터를 Area 0으로 묶는 예</text>
  <rect class="net" x="20" y="78" width="130" height="52" rx="8"/>
  <text x="85" y="101" text-anchor="middle" class="head">LAN 1</text>
  <text x="85" y="119" text-anchor="middle" class="small">192.168.1.0/24</text>
  <rect class="box" x="230" y="70" width="100" height="68" rx="10"/>
  <text x="280" y="97" text-anchor="middle" class="head">R1</text>
  <text x="280" y="117" text-anchor="middle" class="small">ID 1.1.1.1</text>
  <rect class="box" x="470" y="70" width="100" height="68" rx="10"/>
  <text x="520" y="97" text-anchor="middle" class="head">R2</text>
  <text x="520" y="117" text-anchor="middle" class="small">ID 2.2.2.2</text>
  <rect class="net" x="650" y="78" width="130" height="52" rx="8"/>
  <text x="715" y="101" text-anchor="middle" class="head">LAN 2</text>
  <text x="715" y="119" text-anchor="middle" class="small">192.168.2.0/24</text>
  <line class="link" x1="150" y1="104" x2="230" y2="104"/>
  <line class="link" x1="330" y1="104" x2="470" y2="104"/>
  <line class="link" x1="570" y1="104" x2="650" y2="104"/>
  <text x="190" y="96" text-anchor="middle" class="small">Gi0/1</text>
  <text x="610" y="96" text-anchor="middle" class="small">Gi0/1</text>
  <text x="336" y="96" class="small">Gi0/0</text>
  <text x="464" y="96" text-anchor="end" class="small">Gi0/0</text>
  <text x="336" y="122" class="small">10.0.12.1/30</text>
  <text x="464" y="138" text-anchor="end" class="small">10.0.12.2/30</text>
  <text x="400" y="162" text-anchor="middle" class="small">Area 0</text>
  <rect class="code" x="20" y="180" width="350" height="126" rx="8"/>
  <text x="34" y="200" class="small">R1</text>
  <text x="34" y="220" class="mono">router ospf 1</text>
  <text x="34" y="238" class="mono"> router-id 1.1.1.1</text>
  <text x="34" y="256" class="mono"> network 10.0.12.0 0.0.0.3 area 0</text>
  <text x="34" y="274" class="mono"> network 192.168.1.0 0.0.0.255 area 0</text>
  <text x="34" y="292" class="mono"> passive-interface GigabitEthernet0/1</text>
  <rect class="code" x="430" y="180" width="350" height="126" rx="8"/>
  <text x="444" y="200" class="small">R2</text>
  <text x="444" y="220" class="mono">router ospf 1</text>
  <text x="444" y="238" class="mono"> router-id 2.2.2.2</text>
  <text x="444" y="256" class="mono"> network 10.0.12.0 0.0.0.3 area 0</text>
  <text x="444" y="274" class="mono"> network 192.168.2.0 0.0.0.255 area 0</text>
  <text x="444" y="292" class="mono"> passive-interface GigabitEthernet0/1</text>
  <text x="30" y="324" class="small">network 문의 범위에 들어오는 IP를 가진 인터페이스에서 OSPF가 켜지고, 그 인터페이스의 서브넷이 광고된다</text>
  <text x="30" y="341" class="small">passive 인터페이스는 Hello를 보내지 않지만 그 서브넷은 계속 광고된다</text>
</svg>
