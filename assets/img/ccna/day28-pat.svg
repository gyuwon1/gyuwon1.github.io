<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d">
  <title id="t">PAT 변환 테이블</title>
  <desc id="d">PC 두 대가 같은 공인 주소 203.0.113.2를 공유하고 포트 번호만 다르게 바꿔 나가며, 돌아오는 응답은 변환 테이블의 포트로 원래 PC를 찾는다</desc>
  <style>
    text { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 13px; fill: #1f2933; }
    .small { font-size: 11px; fill: #52606d; }
    .head { font-size: 14px; font-weight: 700; }
    .box { fill: #e3f2fd; stroke: #7aa5d2; stroke-width: 1.5; }
    .ok { fill: #e8f5e9; stroke: #2e7d4f; stroke-width: 1.5; }
    .net { fill: #fff8e1; stroke: #d9a441; stroke-width: 1.5; }
    .link { stroke: #7b8794; stroke-width: 2; fill: none; }
    .out { stroke: #2e7d4f; stroke-width: 2.5; fill: none; }
    .back { stroke: #c0762b; stroke-width: 2.5; fill: none; stroke-dasharray: 6 4; }
  </style>
  <rect width="800" height="380" rx="12" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="30" y="32" class="head">주소는 하나, 포트로 구별한다</text>
  <rect class="net" x="30" y="70" width="190" height="56" rx="8"/>
  <text x="125" y="94" text-anchor="middle" class="head">PC1</text>
  <text x="125" y="112" text-anchor="middle" class="small">192.168.1.10:51000</text>
  <rect class="net" x="30" y="150" width="190" height="56" rx="8"/>
  <text x="125" y="174" text-anchor="middle" class="head">PC2</text>
  <text x="125" y="192" text-anchor="middle" class="small">192.168.1.11:49000</text>
  <rect class="ok" x="320" y="90" width="150" height="96" rx="10"/>
  <text x="395" y="124" text-anchor="middle" class="head">NAT 라우터</text>
  <text x="395" y="146" text-anchor="middle" class="small">공인 주소</text>
  <text x="395" y="164" text-anchor="middle" class="small">203.0.113.2</text>
  <rect class="box" x="570" y="110" width="200" height="56" rx="8"/>
  <text x="670" y="134" text-anchor="middle" class="head">웹 서버</text>
  <text x="670" y="152" text-anchor="middle" class="small">198.51.100.5:80</text>
  <line class="out" x1="220" y1="98" x2="320" y2="120"/>
  <line class="out" x1="220" y1="178" x2="320" y2="156"/>
  <line class="out" x1="470" y1="138" x2="570" y2="138"/>
  <text x="520" y="124" text-anchor="middle" class="small">송신</text>
  <text x="395" y="216" text-anchor="middle" class="small">나갈 때 출발지를 203.0.113.2:1024, 203.0.113.2:1025로 바꾼다</text>
  <rect x="30" y="240" width="740" height="120" rx="8" fill="#f5f7fa" stroke="#cbd2d9" stroke-width="1.2"/>
  <text x="46" y="262" class="head">변환 테이블</text>
  <text x="46" y="286" class="small">Inside Global</text><text x="266" y="286" class="small">Inside Local</text><text x="506" y="286" class="small">Outside Global</text>
  <text x="46" y="308" class="small">203.0.113.2:1024</text><text x="266" y="308" class="small">192.168.1.10:51000</text><text x="506" y="308" class="small">198.51.100.5:80</text>
  <text x="46" y="330" class="small">203.0.113.2:1025</text><text x="266" y="330" class="small">192.168.1.11:49000</text><text x="506" y="330" class="small">198.51.100.5:80</text>
  <text x="46" y="350" class="small">응답의 목적지가 203.0.113.2:1025이면 테이블에서 192.168.1.11:49000을 찾아 되돌려 보낸다</text>
</svg>
