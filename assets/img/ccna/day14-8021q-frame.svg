<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t d">
  <title id="t">802.1Q 태그가 삽입된 이더넷 프레임</title>
  <desc id="d">일반 이더넷 프레임의 출발지 MAC 주소 뒤에 4바이트 802.1Q 태그가 삽입된다. 태그는 TPID 2바이트와 PCP 3비트, DEI 1비트, VLAN ID 12비트로 구성된다</desc>
  <style>
    text { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 13px; fill: #1f2933; }
    .small { font-size: 11px; fill: #52606d; }
    .head { font-size: 15px; font-weight: 700; }
    .link { stroke: #9aa5b1; stroke-width: 1.5; fill: none; }
    .trunk { stroke: #2f6fb0; stroke-width: 5; fill: none; }
  </style>
  <rect width="800" height="300" rx="12" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="400" y="26" text-anchor="middle" class="head">802.1Q 태그 삽입</text>
  <text x="30" y="62" class="small">일반 프레임</text>
  <rect x="30" y="70" width="130" height="40" fill="#e3f2fd" stroke="#7aa5d2" stroke-width="2"/>
  <text x="95" y="95" text-anchor="middle">목적지 MAC 6B</text>
  <rect x="160" y="70" width="130" height="40" fill="#e3f2fd" stroke="#7aa5d2" stroke-width="2"/>
  <text x="225" y="95" text-anchor="middle">출발지 MAC 6B</text>
  <rect x="290" y="70" width="90" height="40" fill="#f0f4f8" stroke="#9aa5b1" stroke-width="2"/>
  <text x="335" y="95" text-anchor="middle">Type 2B</text>
  <rect x="380" y="70" width="230" height="40" fill="#f0f4f8" stroke="#9aa5b1" stroke-width="2"/>
  <text x="495" y="95" text-anchor="middle">데이터</text>
  <rect x="610" y="70" width="80" height="40" fill="#f0f4f8" stroke="#9aa5b1" stroke-width="2"/>
  <text x="650" y="95" text-anchor="middle">FCS 4B</text>
  <text x="30" y="152" class="small">트렁크를 지나는 프레임</text>
  <rect x="30" y="160" width="110" height="40" fill="#e3f2fd" stroke="#7aa5d2" stroke-width="2"/>
  <text x="85" y="185" text-anchor="middle">목적지 MAC</text>
  <rect x="140" y="160" width="110" height="40" fill="#e3f2fd" stroke="#7aa5d2" stroke-width="2"/>
  <text x="195" y="185" text-anchor="middle">출발지 MAC</text>
  <rect x="250" y="160" width="140" height="40" fill="#fde8c8" stroke="#d98a1f" stroke-width="3"/>
  <text x="320" y="185" text-anchor="middle">802.1Q 태그 4B</text>
  <rect x="390" y="160" width="70" height="40" fill="#f0f4f8" stroke="#9aa5b1" stroke-width="2"/>
  <text x="425" y="185" text-anchor="middle">Type</text>
  <rect x="460" y="160" width="150" height="40" fill="#f0f4f8" stroke="#9aa5b1" stroke-width="2"/>
  <text x="535" y="185" text-anchor="middle">데이터</text>
  <rect x="610" y="160" width="80" height="40" fill="#f0f4f8" stroke="#9aa5b1" stroke-width="2"/>
  <text x="650" y="185" text-anchor="middle">FCS 재계산</text>
  <path class="link" d="M250 200 L130 235 M390 200 L670 235"/>
  <rect x="130" y="235" width="540" height="40" fill="#fff4d6" stroke="#d4a72c" stroke-width="2"/>
  <text x="195" y="260" text-anchor="middle">TPID 0x8100</text>
  <text x="195" y="272" text-anchor="middle" class="small">2B</text>
  <text x="400" y="260" text-anchor="middle">PCP 3비트 | DEI 1비트 | VLAN ID 12비트</text>
  <text x="400" y="272" text-anchor="middle" class="small">우선순위(QoS) | 폐기 가능 표시 | 1~4094</text>
  <path class="link" d="M262 235 L262 275"/>
</svg>
