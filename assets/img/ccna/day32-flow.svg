<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="t d">
  <title id="t">DHCP 4단계와 PAT 변환 표</title>
  <desc id="d">클라이언트와 서버가 Discover, Offer, Request, Ack를 주고받는 흐름과, 내부 주소 3개가 공인 주소 하나의 서로 다른 포트로 변환되는 표</desc>
  <style>
    text { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 13px; fill: #1f2933; }
    .small { font-size: 11px; fill: #52606d; }
    .head { font-size: 14px; font-weight: 700; }
    .box { fill: #e3f2fd; stroke: #7aa5d2; stroke-width: 1.5; }
    .ok { fill: #e8f5e9; stroke: #2e7d4f; stroke-width: 1.5; }
    .net { fill: #fff8e1; stroke: #d9a441; stroke-width: 1.5; }
    .link { stroke: #7b8794; stroke-width: 2; fill: none; }
  </style>
  <rect width="800" height="340" rx="12" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="30" y="32" class="head">DHCP DORA (UDP 68 → 67)</text>
  <rect class="box" x="30" y="50" width="120" height="40" rx="8"/>
  <text x="90" y="75" text-anchor="middle">클라이언트</text>
  <rect class="ok" x="250" y="50" width="120" height="40" rx="8"/>
  <text x="310" y="75" text-anchor="middle">DHCP 서버</text>
  <line class="link" x1="90" y1="90" x2="90" y2="190"/>
  <line class="link" x1="310" y1="90" x2="310" y2="190"/>
  <line class="link" x1="90" y1="110" x2="310" y2="110"/>
  <text x="200" y="104" text-anchor="middle" class="small">Discover (브로드캐스트)</text>
  <line class="link" x1="310" y1="136" x2="90" y2="136"/>
  <text x="200" y="130" text-anchor="middle" class="small">Offer (주소 제안)</text>
  <line class="link" x1="90" y1="162" x2="310" y2="162"/>
  <text x="200" y="156" text-anchor="middle" class="small">Request (제안 수락)</text>
  <line class="link" x1="310" y1="188" x2="90" y2="188"/>
  <text x="200" y="182" text-anchor="middle" class="small">Ack (확정)</text>
  <text x="30" y="222" class="small">서버가 다른 서브넷에 있으면 라우터의 ip helper-address가 유니캐스트로 전달한다</text>
  <text x="440" y="32" class="head">PAT 변환 표 (공인 203.0.113.5)</text>
  <rect class="net" x="440" y="50" width="330" height="30" rx="4"/>
  <text x="450" y="70" class="head">내부 로컬</text>
  <text x="620" y="70" class="head">내부 글로벌</text>
  <rect class="box" x="440" y="84" width="330" height="30" rx="4"/>
  <text x="450" y="104">192.168.1.10:51000</text>
  <text x="620" y="104">203.0.113.5:1024</text>
  <rect class="box" x="440" y="118" width="330" height="30" rx="4"/>
  <text x="450" y="138">192.168.1.11:51000</text>
  <text x="620" y="138">203.0.113.5:1025</text>
  <rect class="box" x="440" y="152" width="330" height="30" rx="4"/>
  <text x="450" y="172">192.168.1.12:49200</text>
  <text x="620" y="172">203.0.113.5:1026</text>
  <text x="440" y="206" class="small">공인 주소는 하나이고 포트 번호로 내부 호스트를 구분한다</text>
  <text x="440" y="224" class="small">출발지 포트가 같아도(51000) 변환 후 포트는 다르다</text>
  <rect class="ok" x="30" y="256" width="740" height="62" rx="8"/>
  <text x="400" y="282" text-anchor="middle" class="head">둘 다 장비가 표를 들고 있다는 점이 같다</text>
  <text x="400" y="304" text-anchor="middle" class="small">DHCP는 임대 표(주소와 MAC), PAT는 변환 표를 유지하고 시간이 지나면 지운다</text>
</svg>
