<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d">
  <title id="t">VLAN 10에서 VLAN 20으로 가는 패킷의 경로</title>
  <desc id="d">PC1이 보낸 프레임이 SW1에서 VLAN 10 태그가 붙어 트렁크로 R1에 도착하고, R1이 라우팅한 뒤 VLAN 20 태그를 붙여 같은 트렁크로 SW1에 돌려보내면 SW1이 태그를 떼어 PC2에 전달한다</desc>
  <style>
    text { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 13px; fill: #1f2933; }
    .small { font-size: 11px; fill: #52606d; }
    .head { font-size: 15px; font-weight: 700; }
    .link { stroke: #9aa5b1; stroke-width: 1.5; fill: none; }
    .trunk { stroke: #2f6fb0; stroke-width: 5; fill: none; }
    .arrow { stroke: #d98a1f; stroke-width: 2.5; fill: none; }
  </style>
  <rect width="800" height="360" rx="12" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="400" y="26" text-anchor="middle" class="head">같은 링크를 두 번 지난다</text>
  <rect x="30" y="70" width="100" height="50" fill="#e3f2fd" stroke="#7aa5d2" stroke-width="2"/>
  <text x="80" y="100" text-anchor="middle">PC1</text>
  <rect x="30" y="230" width="100" height="50" fill="#e6f4ea" stroke="#6aa77a" stroke-width="2"/>
  <text x="80" y="260" text-anchor="middle">PC2</text>
  <rect x="300" y="140" width="100" height="70" fill="#fff4d6" stroke="#d4a72c" stroke-width="2"/>
  <text x="350" y="180" text-anchor="middle">SW1</text>
  <rect x="650" y="140" width="120" height="70" fill="#f0f4f8" stroke="#9aa5b1" stroke-width="2"/>
  <text x="710" y="180" text-anchor="middle">R1</text>
  <path class="link" d="M130 95 L300 155"/>
  <path class="link" d="M130 255 L300 195"/>
  <path class="trunk" d="M400 175 L650 175"/>
  <path class="arrow" d="M410 160 L640 160"/>
  <path class="arrow" d="M640 190 L410 190"/>
  <text x="525" y="150" text-anchor="middle" class="small">2 태그 10 : 목적지 MAC = R1 Gi0/0.10</text>
  <text x="525" y="206" text-anchor="middle" class="small">4 태그 20 : 목적지 MAC = PC2</text>
  <text x="215" y="102" text-anchor="middle" class="small">1 목적지 MAC = R1</text>
  <text x="215" y="242" text-anchor="middle" class="small">5 태그 없음, 목적지 MAC = PC2</text>
  <text x="710" y="232" text-anchor="middle" class="small">3 라우팅 테이블 조회</text>
  <text x="710" y="248" text-anchor="middle" class="small">Gi0/0.10 수신, Gi0/0.20 송신</text>
  <text x="400" y="320" text-anchor="middle" class="small">IP 주소는 PC1에서 PC2까지 그대로이고, 목적지 MAC과 VLAN 태그만 단계마다 바뀐다</text>
  <text x="400" y="340" text-anchor="middle" class="small">모든 VLAN 간 트래픽이 링크 하나를 오가므로 이 링크의 대역폭이 한계가 된다</text>
</svg>
