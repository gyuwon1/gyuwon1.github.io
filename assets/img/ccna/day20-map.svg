<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d">
  <title>2부에서 배운 기술이 한 구성에 들어가는 위치</title>
  <desc>R1은 SW1과 트렁크로 연결되어 서브인터페이스로 VLAN 10과 VLAN 20을 라우팅한다. SW1과 SW2는 EtherChannel Po1 트렁크로 묶여 있고 SW1이 루트 브리지이다. PC1은 SW1의 VLAN 10 액세스 포트에, PC2는 SW2의 VLAN 20 액세스 포트에 연결되며 두 PC 포트에는 PortFast와 BPDU Guard를 쓴다. SW1과 SW2는 CDP와 LLDP로 서로를 알아본다</desc>
  <style>
    text { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 13px; fill: #1f2933; }
    .small { font-size: 11px; fill: #52606d; }
    .head { font-size: 15px; font-weight: 700; }
    .link { stroke: #7aa5d2; stroke-width: 3; fill: none; }
    .trunk { stroke: #2e7d4f; stroke-width: 3; fill: none; }
    .sw { fill: #e3f2fd; stroke: #7aa5d2; stroke-width: 2; }
    .rt { fill: #fff4e0; stroke: #d98c1f; stroke-width: 2; }
    .pc { fill: #f5f7fa; stroke: #9aa5b1; stroke-width: 2; }
    .th { fill: #e3f2fd; stroke: #7aa5d2; stroke-width: 1.5; }
    .td { fill: #ffffff; stroke: #d9e2ec; stroke-width: 1.5; }
    .arr { stroke: #2e7d4f; stroke-width: 2; fill: none; marker-end: url(#a); }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d4f"/></marker></defs>
  <rect width="800" height="400" rx="12" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="400" y="28" text-anchor="middle" class="head">2부 기술이 놓이는 위치</text>
  <line class="trunk" x1="400" y1="110" x2="400" y2="150"/>
  <rect class="rt" x="320" y="50" width="160" height="60" rx="6"/>
  <text x="400" y="76" text-anchor="middle">R1</text>
  <text x="400" y="96" text-anchor="middle" class="small">Gi0/0.10, Gi0/0.20</text>
  <text x="412" y="136" class="small">트렁크 (802.1Q)</text>
  <rect class="sw" x="320" y="150" width="160" height="70" rx="6"/>
  <text x="400" y="176" text-anchor="middle">SW1</text>
  <text x="400" y="196" text-anchor="middle" class="small">루트 브리지</text>
  <text x="400" y="212" text-anchor="middle" class="small">VLAN 10, 20 정의</text>
  <line class="trunk" x1="480" y1="175" x2="610" y2="175"/>
  <line class="trunk" x1="480" y1="195" x2="610" y2="195"/>
  <text x="545" y="166" text-anchor="middle" class="small">EtherChannel Po1</text>
  <text x="545" y="216" text-anchor="middle" class="small">LACP, 트렁크</text>
  <rect class="sw" x="610" y="150" width="140" height="70" rx="6"/>
  <text x="680" y="176" text-anchor="middle">SW2</text>
  <text x="680" y="196" text-anchor="middle" class="small">VLAN 10, 20 정의</text>
  <line class="link" x1="360" y1="220" x2="200" y2="290"/>
  <line class="link" x1="680" y1="220" x2="680" y2="290"/>
  <text x="240" y="244" class="small">액세스 VLAN 10</text>
  <text x="692" y="250" class="small">액세스 VLAN 20</text>
  <rect class="pc" x="120" y="290" width="160" height="50" rx="6"/>
  <text x="200" y="312" text-anchor="middle">PC1</text>
  <text x="200" y="330" text-anchor="middle" class="small">PortFast, BPDU Guard</text>
  <rect class="pc" x="600" y="290" width="160" height="50" rx="6"/>
  <text x="680" y="312" text-anchor="middle">PC2</text>
  <text x="680" y="330" text-anchor="middle" class="small">PortFast, BPDU Guard</text>
  <text x="400" y="372" text-anchor="middle" class="small">SW1과 SW2는 CDP와 LLDP로 서로의 포트와 모델을 알아본다</text>
</svg>
