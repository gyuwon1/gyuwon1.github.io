<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d">
  <title id="t">HSRP 구성도</title>
  <desc id="d">R1과 R2가 가상 IP 10.0.0.254와 가상 MAC을 공유하고 R1이 Active, R2가 Standby이며 PC는 가상 IP를 기본 게이트웨이로 쓴다</desc>
  <style>
    text { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 13px; fill: #1f2933; }
    .small { font-size: 11px; fill: #52606d; }
    .head { font-size: 14px; font-weight: 700; }
    .mono { font-family: Consolas, "Courier New", monospace; font-size: 12px; }
    .box { fill: #e3f2fd; stroke: #7aa5d2; stroke-width: 1.5; }
    .ok { fill: #e8f5e9; stroke: #2e7d4f; stroke-width: 1.5; }
    .net { fill: #fff8e1; stroke: #d9a441; stroke-width: 1.5; }
    .bad { fill: #fdecea; stroke: #c0392b; stroke-width: 1.5; }
    .code { fill: #f5f7fa; stroke: #cbd2d9; stroke-width: 1.2; }
    .link { stroke: #7b8794; stroke-width: 2; fill: none; }
    .dead { stroke: #c0392b; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .vip { stroke: #2e7d4f; stroke-width: 2.5; fill: none; }
  </style>
  <rect width="800" height="360" rx="12" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="30" y="32" class="head">두 라우터가 가상 라우터 하나를 만든다</text>
  <rect class="net" x="30" y="130" width="140" height="80" rx="8"/>
  <text x="100" y="158" text-anchor="middle" class="head">PC</text>
  <text x="100" y="178" text-anchor="middle" class="small">10.0.0.10</text>
  <text x="100" y="194" text-anchor="middle" class="small">gateway 10.0.0.254</text>
  <rect x="250" y="56" width="300" height="250" rx="14" fill="#f9fbf9" stroke="#2e7d4f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="78" text-anchor="middle" class="head">가상 라우터 (HSRP 그룹 1)</text>
  <text x="400" y="94" text-anchor="middle" class="small">가상 IP 10.0.0.254  /  가상 MAC 0000.0C07.AC01</text>
  <rect class="ok" x="270" y="118" width="120" height="78" rx="10"/>
  <text x="330" y="144" text-anchor="middle" class="head">R1  Active</text>
  <text x="330" y="164" text-anchor="middle" class="small">10.0.0.1</text>
  <text x="330" y="182" text-anchor="middle" class="small">priority 110</text>
  <rect class="box" x="410" y="118" width="120" height="78" rx="10"/>
  <text x="470" y="144" text-anchor="middle" class="head">R2  Standby</text>
  <text x="470" y="164" text-anchor="middle" class="small">10.0.0.2</text>
  <text x="470" y="182" text-anchor="middle" class="small">priority 100</text>
  <line class="link" x1="390" y1="157" x2="410" y2="157"/>
  <text x="400" y="112" text-anchor="middle" class="small">Hello 3초마다 (224.0.0.2, UDP 1985)</text>
  <line class="vip" x1="170" y1="160" x2="270" y2="157"/>
  <text x="220" y="148" text-anchor="middle" class="small">ARP 응답</text>
  <rect class="net" x="610" y="130" width="160" height="80" rx="8"/>
  <text x="690" y="162" text-anchor="middle" class="head">외부 망</text>
  <line class="link" x1="330" y1="196" x2="330" y2="250"/>
  <line class="link" x1="470" y1="196" x2="470" y2="250"/>
  <line class="link" x1="330" y1="250" x2="610" y2="190"/>
  <line class="link" x1="470" y1="250" x2="610" y2="196"/>
  <text x="400" y="278" text-anchor="middle" class="small">Active만 가상 IP로 오는 트래픽을 받아 전달한다</text>
  <text x="30" y="332" class="small">PC가 가상 IP로 ARP를 보내면 Active가 가상 MAC으로 답한다. 장애로 Active가 바뀌어도 PC의 ARP 캐시 내용은 그대로 유효하다</text>
  <text x="30" y="350" class="small">Standby는 Hello를 계속 들으면서 대기하고, Active의 Hello가 끊기면 Active 역할을 넘겨받는다</text>
</svg>
