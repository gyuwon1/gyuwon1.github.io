<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="t d">
  <title id="t">트렁크에서 태그가 붙는 프레임과 붙지 않는 프레임</title>
  <desc id="d">트렁크 링크에서 VLAN 10과 VLAN 20 프레임은 태그가 붙어 전달되고 네이티브 VLAN 1의 프레임은 태그 없이 전달된다. 양쪽 네이티브 VLAN이 다르면 프레임이 다른 VLAN으로 들어간다</desc>
  <style>
    text { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 13px; fill: #1f2933; }
    .small { font-size: 11px; fill: #52606d; }
    .head { font-size: 15px; font-weight: 700; }
    .link { stroke: #9aa5b1; stroke-width: 1.5; fill: none; }
    .trunk { stroke: #2f6fb0; stroke-width: 5; fill: none; }
  </style>
  <rect width="800" height="320" rx="12" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="400" y="26" text-anchor="middle" class="head">네이티브 VLAN은 태그 없이 전달</text>
  <rect x="40" y="60" width="100" height="80" fill="#fff4d6" stroke="#d4a72c" stroke-width="2"/>
  <text x="90" y="105" text-anchor="middle">SW1</text>
  <rect x="660" y="60" width="100" height="80" fill="#fff4d6" stroke="#d4a72c" stroke-width="2"/>
  <text x="710" y="105" text-anchor="middle">SW2</text>
  <path class="trunk" d="M140 100 L660 100"/>
  <rect x="190" y="70" width="140" height="22" fill="#e3f2fd" stroke="#7aa5d2"/>
  <text x="260" y="86" text-anchor="middle" class="small">VLAN 10 (태그 10)</text>
  <rect x="340" y="108" width="140" height="22" fill="#e6f4ea" stroke="#6aa77a"/>
  <text x="410" y="124" text-anchor="middle" class="small">VLAN 20 (태그 20)</text>
  <rect x="490" y="70" width="150" height="22" fill="#f0f4f8" stroke="#9aa5b1" stroke-dasharray="4 3"/>
  <text x="565" y="86" text-anchor="middle" class="small">VLAN 1 (태그 없음)</text>
  <text x="400" y="165" text-anchor="middle" class="small">양쪽 트렁크 포트의 네이티브 VLAN은 같아야 한다 (기본값 VLAN 1)</text>
  <text x="400" y="200" text-anchor="middle" class="head">네이티브 VLAN 불일치</text>
  <rect x="40" y="215" width="100" height="60" fill="#fff4d6" stroke="#d4a72c" stroke-width="2"/>
  <text x="90" y="240" text-anchor="middle">SW1</text>
  <text x="90" y="257" text-anchor="middle" class="small">native 1</text>
  <rect x="660" y="215" width="100" height="60" fill="#fff4d6" stroke="#d4a72c" stroke-width="2"/>
  <text x="710" y="240" text-anchor="middle">SW2</text>
  <text x="710" y="257" text-anchor="middle" class="small">native 99</text>
  <path class="trunk" d="M140 245 L660 245"/>
  <rect x="290" y="226" width="220" height="22" fill="#f0f4f8" stroke="#9aa5b1" stroke-dasharray="4 3"/>
  <text x="400" y="242" text-anchor="middle" class="small">VLAN 1 프레임, 태그 없음</text>
  <text x="400" y="300" text-anchor="middle" class="small">SW2는 태그 없는 프레임을 VLAN 99로 처리한다. CDP 경고가 뜨고 통신이 어긋난다</text>
</svg>
