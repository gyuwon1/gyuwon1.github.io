<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t d">
  <title id="t">ACL 위에서 아래로 평가하는 순서</title>
  <desc id="d">패킷의 출발지 주소를 ACL의 첫 줄부터 차례로 비교한다. 일치하는 줄이 있으면 그 줄의 permit 또는 deny로 처리하고 이후 줄은 보지 않는다. 끝까지 일치하는 줄이 없으면 보이지 않는 마지막 줄인 deny any에 걸려 버려진다.</desc>
  <style>
    text { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 13px; fill: #1f2933; }
    .small { font-size: 11px; fill: #52606d; }
    .head { font-size: 14px; font-weight: 700; }
    .mono { font-family: "Consolas", "Courier New", monospace; font-size: 13px; }
    .row { fill: #f5f7fa; stroke: #cfd8dc; stroke-width: 1.2; }
    .hid { fill: #fdecea; stroke: #c0392b; stroke-width: 1.2; stroke-dasharray: 5 3; }
    .ok { fill: #e8f5e9; stroke: #4c9a5a; stroke-width: 1.5; }
    .red { fill: #fdecea; stroke: #c0392b; stroke-width: 1.5; }
    .box { fill: #e3f2fd; stroke: #7aa5d2; stroke-width: 1.5; }
    .ln { stroke: #52606d; stroke-width: 1.8; fill: none; }
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#52606d"/></marker>
  </defs>
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="20" y="28" class="head">access-list 10 (예)</text>

  <rect x="20" y="44" width="40" height="40" class="box"/>
  <text x="40" y="69" text-anchor="middle">패킷</text>
  <text x="20" y="102" class="small">출발지</text>
  <text x="20" y="116" class="small">192.168.2.5</text>

  <rect x="150" y="44" width="360" height="44" class="row"/>
  <text x="162" y="64" class="mono">1  permit 192.168.1.0 0.0.0.255</text>
  <text x="162" y="80" class="small">192.168.1.x와 일치하는가</text>
  <rect x="150" y="120" width="360" height="44" class="row"/>
  <text x="162" y="140" class="mono">2  deny   192.168.2.0 0.0.0.255</text>
  <text x="162" y="156" class="small">192.168.2.x와 일치하는가</text>
  <rect x="150" y="196" width="360" height="44" class="row"/>
  <text x="162" y="216" class="mono">3  permit 10.0.0.0 0.255.255.255</text>
  <text x="162" y="232" class="small">10.x.x.x와 일치하는가</text>
  <rect x="150" y="272" width="360" height="44" class="hid"/>
  <text x="162" y="292" class="mono">(암묵) deny any</text>
  <text x="162" y="308" class="small">눈에 보이지 않지만 항상 마지막에 있다</text>

  <path d="M330 88 L330 118" class="ln" marker-end="url(#a)"/>
  <text x="340" y="108" class="small">불일치</text>
  <path d="M330 164 L330 194" class="ln" marker-end="url(#a)"/>
  <text x="340" y="184" class="small">불일치</text>
  <path d="M330 240 L330 270" class="ln" marker-end="url(#a)"/>
  <text x="340" y="260" class="small">불일치</text>

  <path d="M510 66 L580 66" class="ln" marker-end="url(#a)"/>
  <rect x="582" y="48" width="160" height="36" class="ok"/>
  <text x="662" y="71" text-anchor="middle">일치 시 통과, 평가 종료</text>
  <path d="M510 142 L580 142" class="ln" marker-end="url(#a)"/>
  <rect x="582" y="124" width="160" height="36" class="red"/>
  <text x="662" y="147" text-anchor="middle">일치 시 폐기, 평가 종료</text>
  <path d="M510 218 L580 218" class="ln" marker-end="url(#a)"/>
  <rect x="582" y="200" width="160" height="36" class="ok"/>
  <text x="662" y="223" text-anchor="middle">일치 시 통과, 평가 종료</text>
  <path d="M510 294 L580 294" class="ln" marker-end="url(#a)"/>
  <rect x="582" y="276" width="160" height="36" class="red"/>
  <text x="662" y="299" text-anchor="middle">모두 불일치하면 폐기</text>

  <text x="20" y="352">출발지 192.168.2.5는 2번 줄에서 처음 일치하므로 폐기된다. 3번 줄은 보지 않는다.</text>
  <text x="20" y="374" class="small">줄 순서가 결과를 바꾼다. 범위가 좁은 조건을 위에, 넓은 조건을 아래에 둔다.</text>
</svg>
