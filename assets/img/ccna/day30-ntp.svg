<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t d">
  <title id="t">NTP 계층 구조</title>
  <desc id="d">원자시계나 GPS 같은 stratum 0 기준 장치에서 stratum 1 서버, stratum 2 서버, 라우터와 스위치로 시각이 내려간다</desc>
  <style>
    text { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 13px; fill: #1f2933; }
    .small { font-size: 11px; fill: #52606d; }
    .head { font-size: 14px; font-weight: 700; }
    .box { fill: #e3f2fd; stroke: #7aa5d2; stroke-width: 1.5; }
    .ok { fill: #e8f5e9; stroke: #2e7d4f; stroke-width: 1.5; }
    .net { fill: #fff8e1; stroke: #d9a441; stroke-width: 1.5; }
    .a1 { stroke: #2e7d4f; stroke-width: 2.2; fill: none; }
    .a2 { stroke: #c0762b; stroke-width: 2.2; fill: none; }
  </style>
  <rect width="800" height="300" rx="12" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="30" y="32" class="head">stratum이 시각의 거리를 나타낸다</text>
  <rect class="net" x="40" y="60" width="150" height="56" rx="8"/><text x="115" y="84" text-anchor="middle" class="head">stratum 0</text><text x="115" y="102" text-anchor="middle" class="small">원자시계, GPS</text>
  <rect class="ok" x="230" y="60" width="150" height="56" rx="8"/><text x="305" y="84" text-anchor="middle" class="head">stratum 1</text><text x="305" y="102" text-anchor="middle" class="small">기준 장치에 직접 연결</text>
  <rect class="ok" x="420" y="60" width="150" height="56" rx="8"/><text x="495" y="84" text-anchor="middle" class="head">stratum 2</text><text x="495" y="102" text-anchor="middle" class="small">stratum 1에서 받는다</text>
  <rect class="box" x="610" y="60" width="150" height="56" rx="8"/><text x="685" y="84" text-anchor="middle" class="head">stratum 3</text><text x="685" y="102" text-anchor="middle" class="small">stratum 2에서 받는다</text>
  <line class="a1" x1="190" y1="88" x2="224" y2="88"/><polygon points="230,88 216,82 216,94" fill="#2e7d4f"/>
  <line class="a1" x1="380" y1="88" x2="414" y2="88"/><polygon points="420,88 406,82 406,94" fill="#2e7d4f"/>
  <line class="a1" x1="570" y1="88" x2="604" y2="88"/><polygon points="610,88 596,82 596,94" fill="#2e7d4f"/>
  <text x="30" y="160" class="head">라우터가 서버와 맞출 때</text>
  <rect class="box" x="60" y="180" width="200" height="56" rx="8"/><text x="160" y="204" text-anchor="middle" class="head">R1</text><text x="160" y="222" text-anchor="middle" class="small">ntp server 10.0.0.1</text>
  <rect class="ok" x="520" y="180" width="200" height="56" rx="8"/><text x="620" y="204" text-anchor="middle" class="head">NTP 서버 10.0.0.1</text><text x="620" y="222" text-anchor="middle" class="small">UDP 123</text>
  <line class="a1" x1="260" y1="195" x2="514" y2="195"/><polygon points="520,195 506,189 506,201" fill="#2e7d4f"/>
  <text x="390" y="188" text-anchor="middle" class="small">시각 요청</text>
  <line class="a2" x1="520" y1="222" x2="266" y2="222"/><polygon points="260,222 274,216 274,228" fill="#c0762b"/>
  <text x="390" y="240" text-anchor="middle" class="small">시각 응답, R1의 시계 보정</text>
  <text x="30" y="276" class="small">숫자가 클수록 기준에서 멀다. 16은 동기화되지 않았다는 뜻이다.</text>
</svg>
