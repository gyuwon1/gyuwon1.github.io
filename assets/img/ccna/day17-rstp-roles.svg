<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d">
  <title>Rapid PVST+의 대체 포트가 루트 포트를 대신하는 과정</title>
  <desc>왼쪽은 정상 상태로, SW1이 루트 브리지이고 SW2와 SW3의 SW1 방향 포트가 루트 포트이며 SW2와 SW3 사이 링크에서 SW3 쪽이 대체 포트이다. 오른쪽은 SW1과 SW3 사이 링크가 끊긴 뒤로, SW3의 대체 포트가 곧바로 루트 포트가 된다</desc>
  <style>
    text { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 13px; fill: #1f2933; }
    .small { font-size: 11px; fill: #52606d; }
    .head { font-size: 15px; font-weight: 700; }
    .link { stroke: #9aa5b1; stroke-width: 3; fill: none; }
    .cut { stroke: #c0392b; stroke-width: 3; stroke-dasharray: 6 5; fill: none; }
    .sw { fill: #e3f2fd; stroke: #7aa5d2; stroke-width: 2; }
    .root { fill: #fff4d6; stroke: #d4a72c; stroke-width: 2; }
    .rp { fill: #2f6fb0; font-size: 12px; font-weight: 700; }
    .dp { fill: #2e7d4f; font-size: 12px; font-weight: 700; }
    .alt { fill: #c0392b; font-size: 12px; font-weight: 700; }
    .panel { fill: #f8fafc; stroke: #d9e2ec; }
  </style>
  <rect width="800" height="330" rx="12" fill="#ffffff" stroke="#d9e2ec"/>
  <rect class="panel" x="10" y="10" width="380" height="310" rx="8"/>
  <rect class="panel" x="410" y="10" width="380" height="310" rx="8"/>
  <text x="200" y="36" text-anchor="middle" class="head">정상 상태</text>
  <text x="600" y="36" text-anchor="middle" class="head">SW1-SW3 링크 장애 후</text>
  <line class="link" x1="170" y1="94" x2="90" y2="210"/>
  <line class="link" x1="230" y1="94" x2="310" y2="210"/>
  <line class="link" x1="150" y1="232" x2="250" y2="232"/>
  <rect class="root" x="130" y="50" width="140" height="44" rx="6"/>
  <text x="200" y="77" text-anchor="middle">SW1 (루트)</text>
  <rect class="sw" x="30" y="210" width="120" height="44" rx="6"/>
  <text x="90" y="237" text-anchor="middle">SW2</text>
  <rect class="sw" x="250" y="210" width="120" height="44" rx="6"/>
  <text x="310" y="237" text-anchor="middle">SW3</text>
  <text x="150" y="114" text-anchor="end" class="dp">지정</text>
  <text x="250" y="114" class="dp">지정</text>
  <text x="80" y="202" text-anchor="end" class="rp">루트</text>
  <text x="322" y="202" class="rp">루트</text>
  <text x="156" y="222" class="dp">지정</text>
  <text x="244" y="222" text-anchor="end" class="alt">대체</text>
  <text x="200" y="290" text-anchor="middle" class="small">SW3의 SW2 방향 포트는 대체 포트이다 (디스카딩)</text>
  <line class="link" x1="570" y1="94" x2="490" y2="210"/>
  <line class="cut" x1="630" y1="94" x2="710" y2="210"/>
  <line x1="662" y1="141" x2="678" y2="163" stroke="#c0392b" stroke-width="4"/>
  <line x1="678" y1="141" x2="662" y2="163" stroke="#c0392b" stroke-width="4"/>
  <line class="link" x1="550" y1="232" x2="650" y2="232"/>
  <rect class="root" x="530" y="50" width="140" height="44" rx="6"/>
  <text x="600" y="77" text-anchor="middle">SW1 (루트)</text>
  <rect class="sw" x="430" y="210" width="120" height="44" rx="6"/>
  <text x="490" y="237" text-anchor="middle">SW2</text>
  <rect class="sw" x="650" y="210" width="120" height="44" rx="6"/>
  <text x="710" y="237" text-anchor="middle">SW3</text>
  <text x="550" y="114" text-anchor="end" class="dp">지정</text>
  <text x="480" y="202" text-anchor="end" class="rp">루트</text>
  <text x="556" y="222" class="dp">지정</text>
  <text x="644" y="222" text-anchor="end" class="rp">루트</text>
  <text x="600" y="290" text-anchor="middle" class="small">대체 포트가 곧바로 루트 포트가 되어 포워딩한다</text>
</svg>
