<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d">
  <title id="t">라우터를 지날 때 바뀌는 MAC과 유지되는 IP</title>
  <desc id="d">PC 192.168.1.10에서 서버 10.0.0.20으로 가는 패킷이 라우터 R1을 지날 때 구간 1과 구간 2의 프레임에서 MAC 주소는 바뀌고 IP 주소는 그대로인 모습</desc>
  <style>
    text { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 14px; fill: #1f2933; }
    .small { font-size: 12px; fill: #52606d; }
    .head { font-size: 15px; font-weight: 700; }
    .mono { font-family: Consolas, "Courier New", monospace; font-size: 14px; }
  </style>
  <rect width="780" height="430" rx="12" fill="#ffffff" stroke="#d9e2ec"/>
  <rect x="20" y="30" width="150" height="64" rx="8" fill="#e3f2fd" stroke="#7aa5d2"/>
  <text x="95.0" y="58" text-anchor="middle" class="head">PC</text>
  <text x="95.0" y="80" text-anchor="middle" class="mono">192.168.1.10</text>
  <rect x="285" y="30" width="210" height="64" rx="8" fill="#e3f2fd" stroke="#7aa5d2"/>
  <text x="390.0" y="58" text-anchor="middle" class="head">라우터 R1</text>
  <text x="390.0" y="80" text-anchor="middle" class="mono">192.168.1.1 / 10.0.0.1</text>
  <rect x="610" y="30" width="150" height="64" rx="8" fill="#e3f2fd" stroke="#7aa5d2"/>
  <text x="685.0" y="58" text-anchor="middle" class="head">서버</text>
  <text x="685.0" y="80" text-anchor="middle" class="mono">10.0.0.20</text>
  <line x1="170" y1="62" x2="285" y2="62" stroke="#486581" stroke-width="2"/>
  <text x="227.5" y="52" text-anchor="middle" class="small">구간 1</text>
  <line x1="495" y1="62" x2="610" y2="62" stroke="#486581" stroke-width="2"/>
  <text x="552.5" y="52" text-anchor="middle" class="small">구간 2</text>
  <rect x="20" y="130" width="360" height="215" rx="8" fill="#f5f7fa" stroke="#9aa5b1"/>
  <text x="200" y="157" text-anchor="middle" class="head">구간 1의 프레임 (PC → R1)</text>
  <rect x="34" y="172" width="332" height="32" fill="#ffe8cc" stroke="#e8a54b"/>
  <text x="46" y="193">출발지 MAC</text>
  <text x="190" y="193" class="mono">PC</text>
  <rect x="34" y="210" width="332" height="32" fill="#ffe8cc" stroke="#e8a54b"/>
  <text x="46" y="231">목적지 MAC</text>
  <text x="190" y="231" class="mono">R1 Gi0/0</text>
  <rect x="34" y="248" width="332" height="32" fill="#d6ecff" stroke="#7aa5d2"/>
  <text x="46" y="269">출발지 IP</text>
  <text x="190" y="269" class="mono">192.168.1.10</text>
  <rect x="34" y="286" width="332" height="32" fill="#d6ecff" stroke="#7aa5d2"/>
  <text x="46" y="307">목적지 IP</text>
  <text x="190" y="307" class="mono">10.0.0.20</text>
  <rect x="400" y="130" width="360" height="215" rx="8" fill="#f5f7fa" stroke="#9aa5b1"/>
  <text x="580" y="157" text-anchor="middle" class="head">구간 2의 프레임 (R1 → 서버)</text>
  <rect x="414" y="172" width="332" height="32" fill="#ffe8cc" stroke="#e8a54b"/>
  <text x="426" y="193">출발지 MAC</text>
  <text x="570" y="193" class="mono">R1 Gi0/1</text>
  <rect x="414" y="210" width="332" height="32" fill="#ffe8cc" stroke="#e8a54b"/>
  <text x="426" y="231">목적지 MAC</text>
  <text x="570" y="231" class="mono">서버</text>
  <rect x="414" y="248" width="332" height="32" fill="#d6ecff" stroke="#7aa5d2"/>
  <text x="426" y="269">출발지 IP</text>
  <text x="570" y="269" class="mono">192.168.1.10</text>
  <rect x="414" y="286" width="332" height="32" fill="#d6ecff" stroke="#7aa5d2"/>
  <text x="426" y="307">목적지 IP</text>
  <text x="570" y="307" class="mono">10.0.0.20</text>
  <rect x="190" y="362" width="18" height="14" fill="#ffe8cc" stroke="#e8a54b"/>
  <text x="214" y="374" class="small">MAC은 구간마다 새로 붙는다</text>
  <rect x="420" y="362" width="18" height="14" fill="#d6ecff" stroke="#7aa5d2"/>
  <text x="444" y="374" class="small">IP는 출발지부터 도착지까지 그대로</text>
  <text x="390" y="410" text-anchor="middle" class="small">라우터는 프레임을 벗겨 목적지 IP로 경로를 고른 뒤 다음 구간의 MAC으로 다시 감싼다</text>
</svg>
