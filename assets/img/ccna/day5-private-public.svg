<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d">
  <title id="t">사설 주소와 공인 주소</title>
  <desc id="d">사설 주소를 쓰는 내부 LAN의 PC가 NAT 기능이 있는 라우터를 거쳐 공인 주소를 쓰는 인터넷 서버에 접속하는 구성도와 RFC 1918 사설 주소 대역 세 개</desc>
  <style>
    text { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 13px; fill: #1f2933; }
    .small { font-size: 12px; fill: #52606d; }
    .head { font-size: 15px; font-weight: 700; }
    .mono { font-family: "Consolas", "Menlo", monospace; font-size: 16px; }
    .line { stroke: #52606d; stroke-width: 2; fill: none; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
  </defs>
  <rect width="800" height="420" rx="12" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="400" y="30" text-anchor="middle" class="head">사설 주소는 내부에서만, 공인 주소는 인터넷에서</text>
  <rect x="30" y="55" width="230" height="190" fill="#e3f2fd" stroke="#7aa5d2" stroke-width="2"/>
  <text x="145" y="80" text-anchor="middle" class="head">내부 LAN (사설 주소)</text>
  <rect x="55" y="100" width="180" height="44" fill="#ffffff" stroke="#7aa5d2" stroke-width="2"/>
  <text x="145" y="127" text-anchor="middle">PC1 192.168.1.10</text>
  <rect x="55" y="170" width="180" height="44" fill="#ffffff" stroke="#7aa5d2" stroke-width="2"/>
  <text x="145" y="197" text-anchor="middle">PC2 192.168.1.11</text>

  <rect x="320" y="105" width="160" height="90" fill="#fff3d6" stroke="#e0b04f" stroke-width="2"/>
  <text x="400" y="130" text-anchor="middle" class="head">라우터 (NAT)</text>
  <text x="400" y="154" text-anchor="middle" class="small">안쪽 192.168.1.1</text>
  <text x="400" y="174" text-anchor="middle" class="small">바깥쪽 198.51.100.7</text>

  <rect x="540" y="55" width="230" height="190" fill="#dcf3e1" stroke="#5aa86e" stroke-width="2"/>
  <text x="655" y="80" text-anchor="middle" class="head">인터넷 (공인 주소)</text>
  <rect x="565" y="120" width="180" height="60" fill="#ffffff" stroke="#5aa86e" stroke-width="2"/>
  <text x="655" y="146" text-anchor="middle">웹 서버</text>
  <text x="655" y="166" text-anchor="middle" class="small">203.0.113.5</text>

  <path class="line" d="M237 122 L318 140"/>
  <path class="line" d="M237 192 L318 165"/>
  <path class="line" d="M482 150 L563 150"/>
  <text x="522" y="138" text-anchor="middle" class="small">NAT 변환</text>

  <text x="400" y="278" text-anchor="middle" class="head">사설 주소 대역 (RFC 1918)</text>
  <rect x="60" y="292" width="200" height="60" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/>
  <text x="160" y="318" text-anchor="middle" class="mono">10.0.0.0/8</text>
  <text x="160" y="340" text-anchor="middle" class="small">10.0.0.0 ~ 10.255.255.255</text>
  <rect x="300" y="292" width="200" height="60" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/>
  <text x="400" y="318" text-anchor="middle" class="mono">172.16.0.0/12</text>
  <text x="400" y="340" text-anchor="middle" class="small">172.16.0.0 ~ 172.31.255.255</text>
  <rect x="540" y="292" width="200" height="60" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="2"/>
  <text x="640" y="318" text-anchor="middle" class="mono">192.168.0.0/16</text>
  <text x="640" y="340" text-anchor="middle" class="small">192.168.0.0 ~ 192.168.255.255</text>
  <text x="400" y="384" text-anchor="middle" class="small">사설 주소 패킷은 인터넷 라우터가 전달하지 않는다. 나갈 때는 NAT가 공인 주소로 바꾼다</text>
</svg>
