<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t d">
  <title>가장 긴 프리픽스 일치로 경로를 고르는 과정</title>
  <desc>목적지 10.1.2.5에 대해 라우팅 테이블의 10.0.0.0/8, 10.1.0.0/16, 10.1.2.0/24, 0.0.0.0/0 네 항목이 어떻게 일치하는지 비교한다. 앞의 24비트가 일치하는 10.1.2.0/24가 가장 길게 일치하므로 이 경로로 전달한다</desc>
  <style>
    text { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 13px; fill: #1f2933; }
    .small { font-size: 11px; fill: #52606d; }
    .head { font-size: 15px; font-weight: 700; }
    .th { fill: #e3f2fd; stroke: #7aa5d2; stroke-width: 1.5; }
    .td { fill: #ffffff; stroke: #d9e2ec; stroke-width: 1.5; }
    .win { fill: #e8f5e9; stroke: #2e7d4f; stroke-width: 2; }
  </style>
  <rect width="800" height="300" rx="12" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="400" y="28" text-anchor="middle" class="head">목적지 10.1.2.5 에 대한 조회</text>
  <rect class="th" x="30" y="50" width="170" height="34"/>
  <text x="115" y="72" text-anchor="middle" class="head">테이블 항목</text>
  <rect class="th" x="200" y="50" width="180" height="34"/>
  <text x="290" y="72" text-anchor="middle" class="head">다음 홉</text>
  <rect class="th" x="380" y="50" width="200" height="34"/>
  <text x="480" y="72" text-anchor="middle" class="head">10.1.2.5 와 일치</text>
  <rect class="th" x="580" y="50" width="190" height="34"/>
  <text x="675" y="72" text-anchor="middle" class="head">일치한 비트 수</text>

  <rect class="td" x="30" y="84" width="170" height="38"/>
  <text x="115" y="108" text-anchor="middle">10.0.0.0/8</text>
  <rect class="td" x="200" y="84" width="180" height="38"/>
  <text x="290" y="108" text-anchor="middle">192.168.12.2</text>
  <rect class="td" x="380" y="84" width="200" height="38"/>
  <text x="480" y="108" text-anchor="middle">일치</text>
  <rect class="td" x="580" y="84" width="190" height="38"/>
  <text x="675" y="108" text-anchor="middle">8</text>

  <rect class="td" x="30" y="122" width="170" height="38"/>
  <text x="115" y="146" text-anchor="middle">10.1.0.0/16</text>
  <rect class="td" x="200" y="122" width="180" height="38"/>
  <text x="290" y="146" text-anchor="middle">192.168.13.2</text>
  <rect class="td" x="380" y="122" width="200" height="38"/>
  <text x="480" y="146" text-anchor="middle">일치</text>
  <rect class="td" x="580" y="122" width="190" height="38"/>
  <text x="675" y="146" text-anchor="middle">16</text>

  <rect class="win" x="30" y="160" width="170" height="38"/>
  <text x="115" y="184" text-anchor="middle" class="head">10.1.2.0/24</text>
  <rect class="win" x="200" y="160" width="180" height="38"/>
  <text x="290" y="184" text-anchor="middle" class="head">192.168.14.2</text>
  <rect class="win" x="380" y="160" width="200" height="38"/>
  <text x="480" y="184" text-anchor="middle" class="head">일치</text>
  <rect class="win" x="580" y="160" width="190" height="38"/>
  <text x="675" y="184" text-anchor="middle" class="head">24 (선택)</text>

  <rect class="td" x="30" y="198" width="170" height="38"/>
  <text x="115" y="222" text-anchor="middle">0.0.0.0/0</text>
  <rect class="td" x="200" y="198" width="180" height="38"/>
  <text x="290" y="222" text-anchor="middle">192.168.15.2</text>
  <rect class="td" x="380" y="198" width="200" height="38"/>
  <text x="480" y="222" text-anchor="middle">일치</text>
  <rect class="td" x="580" y="198" width="190" height="38"/>
  <text x="675" y="222" text-anchor="middle">0</text>
  <text x="400" y="266" text-anchor="middle" class="small">여러 항목이 일치하면 프리픽스 길이가 가장 긴 항목이 선택된다</text>
  <text x="400" y="284" text-anchor="middle" class="small">0.0.0.0/0 은 어떤 목적지와도 일치하는 마지막 수단이다</text>
</svg>
