<section class="vq" id="vocab-quiz" hidden>
  <h2 class="vq-title">단어 퀴즈</h2>
  <p class="vq-desc">위 표의 단어로 푸는 4지선다 퀴즈다.</p>
  <div class="vq-modes" id="vq-modes" role="group" aria-label="퀴즈 종류">
    <button type="button" class="vq-mode" data-mode="km">한자 → 뜻</button>
    <button type="button" class="vq-mode" data-mode="mk">뜻 → 한자</button>
    <button type="button" class="vq-mode" data-mode="kr">한자 → 읽기</button>
  </div>
  <div class="vq-body" id="vq-body" aria-live="polite"></div>
</section>

<style>
  .vq { margin: 40px 0 20px; padding: 20px 16px; border: 1px solid #e8e8e8; border-radius: 8px; background: #fafafa; }
  .vq[hidden] { display: none; }
  .vq-title { margin: 0 0 4px; font-size: 22px; }
  .vq-desc { margin: 0 0 14px; color: #828282; font-size: 14px; }
  .vq-modes { display: flex; flex-wrap: wrap; gap: 8px; }
  .vq button { font: inherit; cursor: pointer; }
  .vq-mode { padding: 8px 14px; border: 1px solid #c9c9c9; border-radius: 20px; background: #fff; color: #333; font-size: 15px; }
  .vq-mode.is-on { background: #2a7ae2; border-color: #2a7ae2; color: #fff; }
  .vq-body { margin-top: 18px; }
  .vq-progress { margin: 0 0 10px; color: #828282; font-size: 14px; }
  .vq-bar { height: 4px; margin: 0 0 16px; background: #e8e8e8; border-radius: 2px; overflow: hidden; }
  .vq-bar > span { display: block; height: 100%; background: #2a7ae2; transition: width .2s; }
  .vq-q { margin: 0 0 16px; font-size: 18px; text-align: center; }
  .vq-q.vq-big { font-size: 38px; font-weight: 700; line-height: 1.3; }
  .vq-opts { display: grid; gap: 8px; }
  .vq-opt { min-height: 48px; padding: 10px 14px; border: 1px solid #c9c9c9; border-radius: 8px; background: #fff; color: #111; font-size: 17px; text-align: center; }
  .vq-opt:hover:not(:disabled) { border-color: #2a7ae2; }
  .vq-opt:disabled { cursor: default; }
  .vq-opt.is-right { background: #e8f5e9; border-color: #2e7d32; color: #1b5e20; font-weight: 700; }
  .vq-opt.is-wrong { background: #ffebee; border-color: #c62828; color: #b71c1c; }
  .vq-fb { margin-top: 14px; padding: 12px 14px; border-radius: 8px; background: #fff; border: 1px solid #e8e8e8; font-size: 15px; line-height: 2; }
  .vq-fb .vq-verdict { display: block; font-weight: 700; }
  .vq-fb .vq-verdict.is-right { color: #2e7d32; }
  .vq-fb .vq-verdict.is-wrong { color: #c62828; }
  .vq-fb rt { font-size: 0.55em; }
  .vq-next, .vq-act { margin-top: 14px; padding: 10px 18px; border: 0; border-radius: 8px; background: #2a7ae2; color: #fff; font-size: 16px; }
  .vq-act.vq-sub { background: #fff; color: #2a7ae2; border: 1px solid #2a7ae2; }
  .vq-score { margin: 0 0 4px; font-size: 28px; font-weight: 700; text-align: center; }
  .vq-sum { margin: 0 0 14px; text-align: center; color: #555; }
  .vq-wrong-list { margin: 0 0 6px; padding: 0; list-style: none; }
  .vq-wrong-list li { padding: 8px 0; border-bottom: 1px solid #e8e8e8; font-size: 15px; }
  .vq-wrong-list b { font-size: 18px; }
  .vq-btns { display: flex; flex-wrap: wrap; gap: 8px; }
  @media (min-width: 600px) { .vq-opts { grid-template-columns: 1fr 1fr; } }
</style>

<script>
(function () {
  var sec = document.getElementById('vocab-quiz');
  if (!sec) return;

  // 글 안의 표(# | 한자 | 히라가나 | 뜻 | 예문)에서 단어를 읽어온다
  var words = [];
  var rows = document.querySelectorAll('.post-content table tbody tr');
  for (var i = 0; i < rows.length; i++) {
    var td = rows[i].querySelectorAll('td');
    if (td.length < 5) continue;
    var w = {
      k: td[1].textContent.trim(),
      r: td[2].textContent.trim(),
      m: td[3].textContent.trim(),
      ex: td[4].innerHTML
    };
    if (w.k && w.r && w.m) words.push(w);
  }
  if (words.length < 4) return;
  sec.hidden = false;

  var MODES = {
    km: { q: function (w) { return w.k; }, a: function (w) { return w.m; }, big: true,  hint: '이 단어의 뜻은?' },
    mk: { q: function (w) { return w.m; }, a: function (w) { return w.k; }, big: false, hint: '뜻에 맞는 한자는?' },
    kr: { q: function (w) { return w.k; }, a: function (w) { return w.r; }, big: true,  hint: '이 단어의 읽기는?' }
  };

  var modesEl = document.getElementById('vq-modes');
  var body = document.getElementById('vq-body');
  var st = null;

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function start(mode, list) {
    st = { mode: mode, order: shuffle(list), i: 0, score: 0, wrong: [] };
    var btns = modesEl.querySelectorAll('.vq-mode');
    for (var b = 0; b < btns.length; b++) {
      btns[b].classList.toggle('is-on', btns[b].getAttribute('data-mode') === mode);
    }
    question();
  }

  function question() {
    var M = MODES[st.mode];
    var w = st.order[st.i];
    var right = M.a(w);
    var pool = shuffle(words).filter(function (x) { return M.a(x) !== right; });
    var seen = {}, opts = [right];
    seen[right] = true;
    for (var p = 0; p < pool.length && opts.length < 4; p++) {
      var v = M.a(pool[p]);
      if (!seen[v]) { seen[v] = true; opts.push(v); }
    }
    opts = shuffle(opts);

    var n = st.order.length;
    var html = '<p class="vq-progress">' + (st.i + 1) + ' / ' + n + '</p>' +
      '<div class="vq-bar"><span style="width:' + Math.round(st.i / n * 100) + '%"></span></div>' +
      '<p class="vq-q' + (M.big ? ' vq-big' : '') + '">' + esc(M.q(w)) + '</p>' +
      '<p class="vq-progress" style="text-align:center;margin-top:-8px">' + M.hint + '</p>' +
      '<div class="vq-opts">';
    for (var o = 0; o < opts.length; o++) {
      html += '<button type="button" class="vq-opt" data-v="' + esc(opts[o]) + '">' + esc(opts[o]) + '</button>';
    }
    html += '</div><div id="vq-fb"></div>';
    body.innerHTML = html;
  }

  function answer(btn) {
    var M = MODES[st.mode];
    var w = st.order[st.i];
    var right = M.a(w);
    var ok = btn.getAttribute('data-v') === right;
    var all = body.querySelectorAll('.vq-opt');
    for (var i = 0; i < all.length; i++) {
      all[i].disabled = true;
      if (all[i].getAttribute('data-v') === right) all[i].classList.add('is-right');
    }
    if (ok) { st.score++; } else { btn.classList.add('is-wrong'); st.wrong.push(w); }

    var last = st.i === st.order.length - 1;
    document.getElementById('vq-fb').innerHTML =
      '<div class="vq-fb"><span class="vq-verdict ' + (ok ? 'is-right' : 'is-wrong') + '">' + (ok ? '정답' : '오답') + '</span>' +
      '<b>' + esc(w.k) + '</b> (' + esc(w.r) + ') ' + esc(w.m) + '<br>' + w.ex + '</div>' +
      '<button type="button" class="vq-next">' + (last ? '결과 보기' : '다음 문제') + '</button>';
  }

  function result() {
    var n = st.order.length;
    var html = '<p class="vq-score">' + st.score + ' / ' + n + '</p>' +
      '<p class="vq-sum">' + (st.wrong.length === 0 ? '전부 맞혔다.' : '틀린 단어 ' + st.wrong.length + '개') + '</p>';
    if (st.wrong.length) {
      html += '<ul class="vq-wrong-list">';
      for (var i = 0; i < st.wrong.length; i++) {
        var w = st.wrong[i];
        html += '<li><b>' + esc(w.k) + '</b> (' + esc(w.r) + ') ' + esc(w.m) + '</li>';
      }
      html += '</ul>';
    }
    html += '<div class="vq-btns">';
    if (st.wrong.length) html += '<button type="button" class="vq-act" data-act="retry">틀린 단어만 다시</button>';
    html += '<button type="button" class="vq-act vq-sub" data-act="again">처음부터</button></div>';
    body.innerHTML = html;
  }

  modesEl.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.vq-mode') : null;
    if (b) start(b.getAttribute('data-mode'), words);
  });

  body.addEventListener('click', function (e) {
    var t = e.target;
    var opt = t.closest ? t.closest('.vq-opt') : null;
    if (opt && !opt.disabled) { answer(opt); return; }
    if (t.closest && t.closest('.vq-next')) {
      if (st.i === st.order.length - 1) { result(); } else { st.i++; question(); }
      return;
    }
    var act = t.closest ? t.closest('.vq-act') : null;
    if (act) {
      if (act.getAttribute('data-act') === 'retry') start(st.mode, st.wrong);
      else start(st.mode, words);
    }
  });

  body.innerHTML = '<p class="vq-progress">위에서 퀴즈 종류를 고르면 시작한다. (' + words.length + '문제)</p>';
})();
</script>
